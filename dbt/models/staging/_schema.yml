version: 2

models:
  - name: stg_plans
    columns:
      - name: plan_id
        data_tests: [unique, not_null]

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]

  - name: stg_invoices
    description: Deduplicated by invoice_id -- exact-duplicate source rows collapsed to one.
    columns:
      - name: invoice_id
        data_tests: [unique, not_null]

  - name: stg_usage_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
