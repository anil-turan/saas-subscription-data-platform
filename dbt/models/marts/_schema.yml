version: 2

models:
  - name: dim_customer
    description: SCD Type 2 customer dimension, one row per (customer, attribute-version).
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ["SMB", "Mid-Market", "Enterprise"]

  - name: dim_plan
    columns:
      - name: plan_id
        data_tests: [unique, not_null]
      - name: tier
        data_tests:
          - accepted_values:
              arguments:
                values: ["starter", "growth", "scale", "enterprise"]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_invoice
    description: Fully-resolved invoices only -- see fact_invoice_rejected for unresolved rows.
    columns:
      - name: invoice_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: plan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_plan')
                field: plan_id
      - name: status_clean
        data_tests:
          - accepted_values:
              arguments:
                values: ["paid", "failed", "refunded", "flagged_for_review"]

  - name: fact_invoice_rejected
    columns:
      - name: invoice_id
        data_tests: [not_null]
      - name: rejection_reason
        data_tests:
          - accepted_values:
              arguments:
                values: ["orphan_customer_id", "invoice_predates_scd_coverage"]

  - name: fact_usage_daily
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

  - name: mrr_monthly
    columns:
      - name: mrr
        data_tests: [not_null]
