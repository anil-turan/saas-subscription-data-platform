name: "saas_subscription_data_platform"
version: "1.0.0"
config-version: 2

profile: "saas_subscription_data_platform"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  pipeline_start_date: "2026-07-27" # SNAPSHOT_START - 7 days buffer, covers late-arriving invoices
  pipeline_end_date: "2026-08-19" # TODAY + 3 days buffer

models:
  saas_subscription_data_platform:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
